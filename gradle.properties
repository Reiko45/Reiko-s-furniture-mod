# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (better parameter names). Latest: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment properties. Latest NeoForge: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.267

# Optional recipe viewer integrations (compile-time APIs only)
jei_version=19.70.0.469
emi_version=1.1.24+1.21.1
loader_version_range=[1,)

## Mod properties
mod_id=reikos_furniture
mod_name=Reiko's Furniture
mod_license=MIT
mod_version=1.2.0
mod_group_id=com.reiko45.furniture
mod_authors=Reiko45
mod_description=Furniture for every room: bedroom, kitchen, dining room, living room, bathroom, office, outdoor, kids' room, laundry room, music room, game room and pet corner. Sit on chairs and sofas, store items in cabinets, cook, brew coffee, play the piano, and make furniture in other mods' woods too.
