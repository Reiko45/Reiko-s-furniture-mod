name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        run: ./gradlew build

      - name: Run in-game tests
        run: ./gradlew runGameTestServer

      - name: Check generated files are up to date
        run: |
          ./gradlew runData
          if [ -n "$(git status --porcelain -- src/generated)" ]; then
            echo "::error::src/generated is out of date. Run ./gradlew runData and commit the result."
            git status --porcelain -- src/generated
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: reikos_furniture
          path: build/libs/*.jar
